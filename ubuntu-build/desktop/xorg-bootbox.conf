# Bootbox desktop v21: Xorg on the emulator's virtio GPU (direct display - no VNC server in the guest).
# The page reads the scanout straight from the engine's memory and feeds the virtio tablet + keyboard.
# No udev here: bb-xorg creates the device nodes and the /dev/input/bb-* links before Xorg starts.
Section "ServerFlags"
    Option "AutoAddDevices"   "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"     "true"
    Option "DontZap"          "true"
    Option "BlankTime"        "0"
    Option "StandbyTime"      "0"
    Option "SuspendTime"      "0"
    Option "OffTime"          "0"
EndSection

Section "Device"
    Identifier "virtio"
    Driver     "modesetting"
    Option     "kmsdev"       "/dev/dri/card0"
    # 2D only: no glamor (no GL in the X server; GL apps use the Bootbox GPU bridge), shadow buffer on,
    # so only damaged rectangles reach the GPU (dirty-fb -> virtio-gpu flush -> the page)
    Option     "AccelMethod"  "none"
    Option     "ShadowFB"     "true"
    Option     "PageFlip"     "false"
    Option     "SWcursor"     "false"
EndSection

Section "Screen"
    Identifier   "screen"
    Device       "virtio"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768"
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/bb-kbd"
EndSection

Section "InputDevice"
    Identifier "tablet"
    Driver     "evdev"
    Option     "Device" "/dev/input/bb-tablet"
    Option     "Mode"   "Absolute"
EndSection

Section "ServerLayout"
    Identifier  "bootbox"
    Screen      "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "tablet"   "CorePointer"
EndSection
